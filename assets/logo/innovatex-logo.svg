<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="ix-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45E6D0" />
      <stop offset="50%" stop-color="#4DA3FF" />
      <stop offset="100%" stop-color="#9B6CFF" />
    </linearGradient>
    <linearGradient id="ix-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#45E6D0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B6CFF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="ix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Monogram Mark -->
  <g transform="translate(6, 6)" filter="url(#ix-glow)">
    <!-- Hexagonal outer boundary / facet lines -->
    <path d="M 24 2 L 44 14 L 44 34 L 24 46 L 4 34 L 4 14 Z" stroke="url(#ix-grad-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="rgba(69, 230, 208, 0.05)"/>
    
    <!-- Bold 'I' and 'X' core vectors -->
    <!-- Stylized 'I' column -->
    <line x1="16" y1="14" x2="16" y2="34" stroke="#45E6D0" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Stylized 'X' intersection -->
    <path d="M 24 14 L 38 34" stroke="#4DA3FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 38 14 L 24 34" stroke="#9B6CFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Center energy nexus point -->
    <circle cx="31" cy="24" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark Text -->
  <g transform="translate(64, 38)">
    <text font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" letter-spacing="0.08em" fill="#F8FAFC">
      INNOVATE<tspan fill="url(#ix-grad-primary)">X</tspan>
    </text>
    <text x="126" y="-12" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="11" letter-spacing="0.12em" fill="#45E6D0">
      2026
    </text>
  </g>
</svg>
